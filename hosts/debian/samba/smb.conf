# Samba config for the "debian" home server: shares the admin user's home and /mnt/storage to Macs.
# Replace "youruser" below, then: sudo cp smb.conf /etc/samba/smb.conf
# Check syntax with: testparm -s

[global]
   workgroup = WORKGROUP
   server string = debian
   server role = standalone server

   # Only the home LAN, Tailscale (100.64.0.0/10) and this machine may connect.
   hosts allow = 127.0.0.1 192.168.1.0/24 100.64.0.0/10   # adjust the LAN range
   hosts deny = 0.0.0.0/0

   # Password login only, no guests, modern protocol only.
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2
   security = user

   # No printer sharing.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Mac compatibility (Finder metadata, resource forks).
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[home]
   comment = home folder
   path = /home/youruser
   valid users = youruser
   read only = no
   create mask = 0664
   directory mask = 0775
   # Keep credentials and shell history out of the share (hidden and inaccessible).
   veto files = /.ssh/.docker/.bash_history/

[storage]
   comment = HDD
   path = /mnt/storage
   valid users = youruser
   read only = no
   create mask = 0664
   directory mask = 0775
