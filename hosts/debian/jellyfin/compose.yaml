services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    ports:
      - "127.0.0.1:8096:8096"
      - "${TS_IP}:8096:8096"
    volumes:
      - /mnt/storage/jellyfin/config:/config
      - /mnt/storage/jellyfin/cache:/cache
      - /mnt/storage/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    restart: unless-stopped
