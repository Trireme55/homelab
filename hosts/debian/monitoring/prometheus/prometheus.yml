global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['prometheus:9090']}]
  - job_name: node
    scrape_interval: 30s   # hwmon (sensor) collector takes ~2s on this host
    scrape_timeout: 15s
    static_configs: [{targets: ['172.30.90.1:9100']}]
  - job_name: cadvisor
    static_configs: [{targets: ['cadvisor:8080']}]
  - job_name: loki
    static_configs: [{targets: ['loki:3100']}]
  - job_name: alloy
    static_configs: [{targets: ['alloy:12345']}]
  - job_name: grafana
    static_configs: [{targets: ['grafana:3000']}]
