services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    container_name: filebrowser
    restart: unless-stopped
    entrypoint: ["tini", "--", "sh", "-c", "umask 002 && exec /init.sh"]   # so new files are group-writable for Samba users
    user: '1000:1001'   # admin user + the 'share' group, same group as the Samba share
    ports:
      - 127.0.0.1:8085:8080
    volumes:
      - /mnt/hdd2tb/Shared:/srv
      - ./data:/data
    environment:
      FB_DATABASE: /data/filebrowser.db
      FB_ROOT: /srv
      FB_ADDRESS: 0.0.0.0
      FB_PORT: '8080'
