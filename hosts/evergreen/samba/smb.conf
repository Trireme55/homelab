[global]
   server string = evergreen hub
   workgroup = WORKGROUP
   # Tailscale-only: enforced by host firewall (INPUT drop, only tailscale0 open) + hosts allow
   hosts allow = 127.0.0.1 100.64.0.0/10 fd7a:115c:a1e0::/48
   hosts deny = ALL
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3
   map to guest = never
   restrict anonymous = 2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   # macOS Finder compatibility (metadata stored in xattrs, no ._ files)
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:nfs_aces = no
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[Shared]
   path = /mnt/hdd2tb/Shared
   read only = no
   valid users = @share
   force group = share
   create mask = 0664
   directory mask = 2775
   browseable = yes
