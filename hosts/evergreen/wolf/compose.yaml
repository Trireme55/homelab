services:
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable
    container_name: wolf
    environment:
      # Only one GPU on this host (Intel iGPU, renderD128), so no
      # WOLF_RENDER_NODE pin needed. Debian needs one because it has two GPUs.
      #
      # Errors only from GStreamer. At the default level an orphaned audio
      # pipeline (pulsesrc) logs a warning per loop pass and filled debian's SSD
      # once; same fix here since it isn't hardware-specific.
      - GST_DEBUG=1
    volumes:
      - /etc/wolf/:/etc/wolf
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /dev/:/dev/:rw
      - /run/udev:/run/udev:rw
    device_cgroup_rules:
      - 'c 13:* rmw'
    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid
    network_mode: host
    restart: unless-stopped
